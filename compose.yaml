services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: schroedingerschat
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - app-network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d schroedingerschat"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/schroedingerschat
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      DOMAIN: ${DOMAIN:-localhost}
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - backend

  collab:
    build:
      context: ./collab
    container_name: hocuspocus-server
    restart: unless-stopped
    environment:
      PORT: 3001
      AUTH_ENDPOINT: http://backend:8080/api/editor/auth
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/schroedingerschat
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh:ro
    networks:
      - app-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - acme-challenge:/usr/share/nginx/html:rw
    networks:
      - app-network
    depends_on:
      - backend
      - frontend
      - collab
      - ollama

  certbot:
    image: certbot/certbot
    volumes:
      - letsencrypt:/etc/letsencrypt:rw
      - acme-challenge:/var/www/certbot:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

  adminer:
    image: adminer
    networks:
      - app-network
    ports:
      - "8081:8080"
    depends_on:
      - db

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - app-network
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  pgdata:
  minio_data:
  letsencrypt:
  acme-challenge:
  ollama_data:

networks:
  app-network:
    driver: bridge