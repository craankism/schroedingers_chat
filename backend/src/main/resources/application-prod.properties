# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://db:5432/schroedingerschat
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SuperAdmin Credentials (aus Environment Variablen)
superadmin.email=${SUPERADMIN_EMAIL:admin@schroedingerschat.local}
superadmin.password=${SUPERADMIN_PASSWORD:superadmin123}