# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://db:5432/schroedingerschat
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SuperAdmin Credentials (aus Environment Variablen)
superadmin.email=${SUPERADMIN_EMAIL}
superadmin.password=${SUPERADMIN_PASSWORD}

jwt.token.secret=${JWT_SECRET}

# MinIO Konfiguration
minio.endpoint=http://minio:9000
minio.access.name=${MINIO_ROOT_USER}
minio.access.secret=${MINIO_ROOT_PASSWORD}
minio.bucket.name=schroedingers-files

encryption.master-key=${ENCRYPTION_MASTER_KEY}

websocket.allowed-origins=https://${DOMAIN:localhost},https://${DOMAIN:localhost}:8443

# Containerized Ollama
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://ollama:11434
spring.ai.ollama.chat.model=${OLLAMA_MODEL:qwen2.5-coder:3b}
spring.ai.ollama.chat.temperature=0.3
spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:latest}

# Mail (dev)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_USERNAME}
spring.mail.password=${MAILTRAP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true

ai.enabled=true